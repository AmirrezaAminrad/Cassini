<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="system-ui,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Build time per item, before and after the allocation fix</title>
  <desc id="d">Microseconds per inserted item: 2,000 vectors 344 to 230; 10,000 vectors 578 to 373; 30,000 vectors 745 to 523.</desc>
  <rect width="640" height="360" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="70" y="26" font-size="15" font-weight="600" fill="#1f2937">Build time per item (µs, lower is better)</text>
  <text x="70" y="44" font-size="11" fill="#6b7280">64-d cosine, uniform random vectors, defaults</text>
  <g stroke="#e5e7eb"><line x1="70" y1="219" x2="600" y2="219"/><line x1="70" y1="138" x2="600" y2="138"/><line x1="70" y1="57" x2="600" y2="57"/></g>
  <line x1="70" y1="300" x2="600" y2="300" stroke="#9ca3af"/>
  <g font-size="11" fill="#6b7280" text-anchor="end"><text x="62" y="304">0</text><text x="62" y="223">250</text><text x="62" y="142">500</text><text x="62" y="61">750</text></g>
  <g fill="#9ca3af">
    <rect x="100" y="188" width="50" height="112"/><rect x="280" y="112" width="50" height="188"/><rect x="460" y="58" width="50" height="242"/>
  </g>
  <g fill="#2563eb">
    <rect x="160" y="225" width="50" height="75"/><rect x="340" y="179" width="50" height="121"/><rect x="520" y="130" width="50" height="170"/>
  </g>
  <g font-size="11" fill="#1f2937" text-anchor="middle">
    <text x="125" y="182">344</text><text x="185" y="219">230</text>
    <text x="305" y="106">578</text><text x="365" y="173">373</text>
    <text x="485" y="52">745</text><text x="545" y="124">523</text>
  </g>
  <g font-size="12" fill="#1f2937" text-anchor="middle"><text x="155" y="322">2 000</text><text x="335" y="322">10 000</text><text x="515" y="322">30 000</text></g>
  <g font-size="12" fill="#1f2937">
    <rect x="70" y="338" width="12" height="12" fill="#9ca3af"/><text x="88" y="348">before</text>
    <rect x="150" y="338" width="12" height="12" fill="#2563eb"/><text x="168" y="348">after</text>
  </g>
</svg>
